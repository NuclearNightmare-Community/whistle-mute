# CI: the shared check from NuclearNightmare-Community/ci (mod.json, luacheck, PSScriptAnalyzer, ./test.ps1), pinned to
# one ci commit in both `uses:` and `ci-ref`. Re-pin with the workspace's tools/ci/pin.ps1 after a ci change.
name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# No default token permissions; the job asks only for what it needs.
permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: NuclearNightmare-Community/ci/.github/workflows/mod.yml@e1576456f6eb5a86f7f91d70fb15cb0f8f81f018 # v0.1.0
    with:
      ci-ref: e1576456f6eb5a86f7f91d70fb15cb0f8f81f018
